services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,INTERNAL://0.0.0.0:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,INTERNAL://kafka:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: '5L6g3nShT-eMCtK--X86sw'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - satellite-network

  propagator:
    image: miguelliceon/propagator:latest
    container_name: propagator
    environment:
      KAFKA_BROKER: kafka:19092
      TLE_TOPIC: satellites.tle.raw
      POSITION_TOPIC: satellites.position
      DLQ_TOPIC: satellites.dlq
      GROUP_ID: orbit-propagator
      TICK_MS: 5000
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - satellite-network

  nodered:
    image: nodered/node-red:latest
    container_name: mynodered
    ports:
      - "1880:1880"
    environment:
      TZ: Europe/Madrid
    volumes:
      - node_red_data:/data
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - satellite-network

volumes:
  kafka-data:
  node_red_data:
    external: true

networks:
  satellite-network:
